name: npm publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      oidc:
        description: 'Use OIDC provenance (requires npm trusted publisher already configured)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test and pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install DSH test runtime
        run: npm install --no-save --package-lock=false --legacy-peer-deps @deepseek-ai/dsh@0.2.0-rc.2

      - name: Run tests
        run: npm test
        env:
          DSH_TEST_RUNTIME_ANCHOR: ${{ github.workspace }}/node_modules/@deepseek-ai/dsh/package.json

      - name: Build client bundle
        run: npm run build

      - name: Syntax check
        run: npm run check

      - name: Dry-run pack
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build client bundle
        run: npm run build

      - name: Publish with npm token (first-time setup)
        if: github.event_name == 'workflow_dispatch' && !inputs.oidc
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with OIDC provenance
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.oidc)
        run: npm publish --access public --provenance
